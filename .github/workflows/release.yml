name: Production Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version_and_sync:
    name: 0. Verify Sync & 360 Brand Integrity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch private source from GitLab
        shell: bash
        run: |
          echo "=== 0. Fetching private source code from GitLab ==="
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          echo "Fetching target ref: $target_ref from GitLab..."
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify 360 Brand Apply & Integrity
        shell: bash
        run: |
          echo "=== 2. Verifying 360 Brand engine application ==="
          npm ci

          # 2a. Bộ quy tắc phải SONG ÁNH. Một mẫu `protected` chặn một chiều mà
          #     thiếu cặp đối xứng sẽ làm hỏng mã nguồn vĩnh viễn sau một chu kỳ
          #     restore->apply (vd VuaOfficeIcon -> GenOfficeIcon, không đảo lại được).
          node scripts/360-brand.js selftest

          node scripts/360-brand.js apply

          # 2b. Sau apply, engine phải báo SẠCH. Đây là kiểm chứng THỰC CHẤT rằng
          #     quy trình 360 brand đã chạy đúng.
          node scripts/360-brand.js status

          # 2c. Không chuỗi thương hiệu upstream nào được lọt ra bề mặt người dùng.
          node tools/check-brand.mjs

          # 2d. Kiểm tra tính bất biến của bản ghi audit.
          node tools/check-audit-immutable.mjs

          echo "360 Brand integrity check passed."

      - id: release
        name: Validate Release Version Tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./apps/shell/package.json').version")"
          fi
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a semantic version, got: $tag" >&2
            exit 1
          fi
          manifest="$(node -p "require('./apps/shell/package.json').version")"
          if [[ "$version" != "$manifest" ]]; then
            echo "Tag $tag does not match package.json ($manifest). Bump the version first." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build_mac_x64:
    name: 1. macOS Intel
    needs: version_and_sync
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private source from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install dependencies & Apply 360 Brand
        run: |
          npm ci
          node scripts/360-brand.js apply
      - name: Build macOS Intel (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:x64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS Intel Assets
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: macos-x64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml

  build_mac_arm64:
    name: 2. macOS Silicon (arm64)
    needs: version_and_sync
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private source from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install dependencies & Apply 360 Brand
        run: |
          npm ci
          node scripts/360-brand.js apply
      - name: Build macOS Silicon (arm64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:mac:arm64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS Silicon Assets
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: macos-arm64
          path: |
            apps/shell/release/*.dmg
            apps/shell/release/*.zip
            apps/shell/release/latest-mac.yml

  build_windows_x64:
    name: 3. Windows (x64)
    needs: version_and_sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private source from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies & Apply 360 Brand
        run: |
          npm ci
          node scripts/360-brand.js apply
      - name: Build Windows (x64)
        run: |
          npm run notices
          npm run build:all
          npm run dist:win:x64 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Windows x64 Assets
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-x64
          path: |
            apps/shell/release/*.exe
            apps/shell/release/latest.yml

  build_windows_x86:
    name: 4. Windows (x86)
    needs: version_and_sync
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private source from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - name: Install dependencies & Apply 360 Brand
        run: |
          npm ci
          node scripts/360-brand.js apply
      - name: Build Windows (x86)
        run: |
          npm run notices
          npm run build:all
          npm run dist:win:ia32 -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Windows x86 Assets
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: windows-x86
          path: |
            apps/shell/release/*.exe

  build_linux:
    name: 5. Linux 22.04/24.04 (AppImage & deb)
    needs: version_and_sync
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private source from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies & Apply 360 Brand
        run: |
          npm ci
          node scripts/360-brand.js apply
      - name: Build Linux (AppImage & deb)
        run: |
          npm run notices
          npm run build:all
          npm run dist:linux -w @genoffice/shell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENOFFICE_UPDATE_URL: https://github.com/360org/vuaoffice/releases/latest/download
      - name: Upload Linux Assets
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: linux-x64
          path: |
            apps/shell/release/*.AppImage
            apps/shell/release/*.deb
            apps/shell/release/latest-linux.yml

  publish_release:
    name: 6. Publish Official Release
    needs: [version_and_sync, build_mac_x64, build_mac_arm64, build_windows_x64, build_windows_x86, build_linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch private scripts from GitLab
        shell: bash
        run: |
          git remote add gitlab "${{ secrets.GITLAB_DEPLOY_TOKEN }}" 2>/dev/null || true
          target_ref="${{ github.ref_name }}"
          git fetch gitlab "$target_ref" || git fetch gitlab main
          git checkout -f FETCH_HEAD -- scripts/merge-mac-feed.js 2>/dev/null || true
      - name: Download all build artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: artifacts
      - name: Merge multi-arch macOS update feed
        run: |
          node scripts/merge-mac-feed.js artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version_and_sync.outputs.tag }}
          name: VuaOffice ${{ needs.version_and_sync.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/merged-feed/latest-mac.yml
            artifacts/windows-x64/latest.yml
            artifacts/linux-x64/latest-linux.yml
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
